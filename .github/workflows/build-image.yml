name: Build RDstreamer

# Actions → Build RDstreamer → Run workflow. Builds the package and the SD
# card image from this branch and attaches both to a GitHub release (or,
# with "release" unticked, to the run as artifacts). A name starting with a
# version number ("1.3 · ...") makes a signed release that devices update to
# from the web interface
on:
  workflow_dispatch:
    inputs:
      image:
        description: Build the SD card image too (about 30-60 minutes)
        type: boolean
        default: true
      release:
        description: Publish as a GitHub release (files stay downloadable)
        type: boolean
        default: true
      name:
        description: "Release name starting with the version, e.g. 1.3 · Updates (no number: a test build devices won't update to)"
        required: false
      notes:
        description: What this release has, in a line (optional)
        required: false

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    outputs:
      version: ${{ steps.version.outputs.version }}
      updatable: ${{ steps.version.outputs.updatable }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential dpkg-dev \
            pkg-config openssl python3 \
            libglib2.0-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstrtspserver-1.0-dev

      - uses: actions/checkout@v7

      - name: Version
        id: version
        env:
          NAME: ${{ inputs.name }}
        run: |
          # A name starting with a number ("1.3 · ...") is that version: the
          # package gets it, and devices compare it to offer the update
          short=$(printf '%s' "$NAME" | awk '{print $1}')
          if printf '%s' "$short" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            semver=$(printf '%s' "$short" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}')
            sed -i "0,/^version = \".*\"/s//version = \"$semver\"/" device/backend/Cargo.toml
            grep -m1 '^version' device/backend/Cargo.toml
            echo "version=$semver" >>"$GITHUB_OUTPUT"
            echo "updatable=true" >>"$GITHUB_OUTPUT"
          else
            crate=$(sed -n 's/^version = "\(.*\)"/\1/p' device/backend/Cargo.toml | head -1)
            echo "version=$crate-rd.$(date -u +%Y%m%d)" >>"$GITHUB_OUTPUT"
            echo "updatable=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: device/backend
          cache-bin: true
      - name: Install cargo-deb
        run: command -v cargo-deb || cargo install cargo-deb --locked

      - name: Test the backend
        # The web interface is compiled into the backend, so its folder has
        # to exist before the tests build it; the next step fills it
        run: |
          mkdir -p device/frontend/dist
          mise run backend:test

      - name: Build the package
        run: |
          mise run frontend:install
          mise run device:deb
          ls -l device/backend/target/debian/*.deb

      # For the web interface's updater: it installs only packages signed
      # with the private half of device/packaging/update-key.pub
      - name: Sign the package
        if: steps.version.outputs.updatable == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::Add the UPDATE_SIGNING_KEY secret (Settings → Secrets and variables → Actions) to sign updates."; exit 1; }
          deb=$(ls device/backend/target/debian/*.deb)
          key="$RUNNER_TEMP/update-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" >"$key")
          YSTREAMER_SIGNING_KEY="$key" device/packaging/sign.sh "$deb"
          # Checked against the key the devices have
          dir=$(mktemp -d)
          {
            printf '\060\052\060\005\006\003\053\145\160\003\041\000'
            base64 -d device/packaging/update-key.pub
          } >"$dir/key.der"
          openssl pkey -pubin -inform DER -in "$dir/key.der" -out "$dir/key.pem"
          base64 -d "$deb.sig" >"$dir/signature"
          openssl pkeyutl -verify -pubin -inkey "$dir/key.pem" -rawin -in "$deb" -sigfile "$dir/signature"

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            device/backend/target/debian/*.deb
            device/backend/target/debian/*.deb.sig
          if-no-files-found: error
          retention-days: 30

  image:
    name: SD card image
    needs: package
    if: inputs.image
    # pi-gen runs in Docker; on an arm64 runner it builds natively
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: package

      - name: Make room
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Build the image
        run: image/build.sh "$(ls package/*.deb)"

      - name: Name and check it
        env:
          NAME: ${{ inputs.name }}
        run: |
          src=$(ls image/deploy/*.img.xz | head -1)
          # 1.1 from a name like "1.1 · LUT + Dewarp", so files tell apart
          short=$(printf '%s' "$NAME" | awk '{print $1}' | tr -c 'A-Za-z0-9.\n-' '-')
          dst="image/deploy/rdstreamer-${short:-${{ needs.package.outputs.version }}}.img.xz"
          mv "$src" "$dst"
          xz --test "$dst"
          ls -lh "$dst"

      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image/deploy/rdstreamer-*.img.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish
    needs: [package, image]
    # Not after a cancelled or failed image: a release without one confuses
    if: >-
      always() && inputs.release && needs.package.result == 'success' &&
      (needs.image.result == 'success' || (needs.image.result == 'skipped' && !inputs.image))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ needs.package.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cd assets
          sha256sum * >SHA256SUMS
          cat SHA256SUMS
          if [ -n "$NAME" ]; then
            title="RDstreamer $NAME"
            # The name's first word (1.1, say) in the tag, so it says what it is
            short=$(printf '%s' "$NAME" | awk '{print $1}' | tr -c 'A-Za-z0-9.\n-' '-')
            tag="rd-$short-${{ github.run_number }}"
          else
            title="RDstreamer $VERSION ($BRANCH)"
            tag="rd-$VERSION-${{ github.run_number }}"
          fi
          {
            [ -n "$NOTES" ] && printf '%s\n\n' "$NOTES"
            printf 'Branch `%s`, commit %s.\n\n' "$BRANCH" "${{ github.sha }}"
            printf '%s\n' "Write the .img.xz to a microSD card with Raspberry Pi Imager (Use custom). Or install the .deb from System → Update: devices with RDstreamer 1.3 or newer find and install signed releases by themselves."
          } >../notes.md
          # What devices look for: the newest release's manifest.json
          extra=()
          if [ "${{ needs.package.outputs.updatable }}" = true ]; then
            deb=$(ls *.deb)
            python3 - "$VERSION" "https://github.com/${{ github.repository }}/releases/download/$tag/$deb" "$(cat "$deb.sig")" "${NOTES:-$NAME}" "$deb" >manifest.json <<'PY'
          import json, os, sys
          version, url, signature, notes, deb = sys.argv[1:]
          json.dump({"version": version, "notes": notes,
                     "packages": {"arm64": {"url": url, "signature": signature,
                                            "size": os.path.getsize(deb)}}}, sys.stdout, indent=2)
          PY
            cat manifest.json
          else
            # Without a version number devices couldn't tell it's newer: kept
            # off "latest", where they look
            extra+=(--prerelease)
          fi
          gh release create "$tag" * \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$title" \
            --notes-file ../notes.md "${extra[@]}"
